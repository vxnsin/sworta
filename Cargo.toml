[package]
name = "sworta"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
single-instance = "0.3.3"
tauri-winrt-notification = "0.8.1"
tray-icon = "0.26.1"
ureq = { version = "3.5.0", features = ["json"] }
winreg = "0.56.0"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1

[build-dependencies]
winresource = "0.1.34"
