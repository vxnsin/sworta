[package]
name = "sworta"
version = "0.4.1"
edition = "2024"

[dependencies]
chrono = "0.4.45"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
kamadak-exif = "0.6.1"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
single-instance = "0.3.3"
tauri-winrt-notification = "0.8.1"
tray-icon = "0.26.1"
ureq = { version = "3.5.0", features = ["json"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_SystemServices", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_Storage_EnhancedStorage"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.56.0"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1

[build-dependencies]
winresource = "0.1.34"
