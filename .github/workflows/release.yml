name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag muss zur Cargo-Version passen
        shell: bash
        run: |
          ver=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
          if [ "v$ver" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} passt nicht zu Cargo.toml ($ver)"; exit 1
          fi

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $ico = Get-ChildItem target/release/build -Recurse -Filter sworta.ico | Select-Object -First 1
          Copy-Item $ico.FullName installer/sworta.ico
          $ver = "${{ github.ref_name }}".TrimStart('v')
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" installer/sworta.iss
          if (-not (Test-Path dist/SWORTA-Setup.exe)) { throw "Installer wurde nicht erzeugt" }

      - name: Pakete
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist/SWORTA | Out-Null
          # Bare exe: this is what the in-app updater downloads.
          Copy-Item target/release/sworta.exe dist/SWORTA.exe
          Copy-Item target/release/sworta.exe dist/SWORTA/SWORTA.exe
          Copy-Item README.md dist/SWORTA/README.md
          Compress-Archive -Path dist/SWORTA -DestinationPath dist/SWORTA-Portable.zip

      - name: Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/SWORTA-Setup.exe dist/SWORTA-Portable.zip dist/SWORTA.exe \
            --title "SWORTA ${GITHUB_REF_NAME}" \
            --notes "**SWORTA-Setup.exe**: installer (recommended). **SWORTA-Portable.zip**: no install needed. **SWORTA.exe**: the bare program the in-app updater uses, you normally do not need it." \
            --generate-notes
