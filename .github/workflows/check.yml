name: check

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      # Also checks every camera in cameras/: valid file, unique id, recognised by its own folders.
      - name: Test
        run: cargo test
